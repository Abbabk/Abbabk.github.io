/* Base styles */
body {
  font-family: 'Inter', sans-serif;
  background-color: #0f172a; /* slate-900 */
  color: #cbd5e1; /* slate-300 */
}

/* Animation styles */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-fadeIn {
  animation: fadeIn 0.5s ease-out forwards;
}

/* Dragging style for ActionCard */
.dragging {
  opacity: 0.9;
  box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  transform: scale(1.03);
  border-color: #0ea5e9; /* sky-500 */
  z-index: 50;
}

@keyframes highlight-and-fade {
  0% { background-color: rgba(56, 189, 248, 0.4); } /* sky-400/40 */
  100% { background-color: transparent; }
}
.animate-highlight {
  animation: highlight-and-fade 2s ease-out forwards;
}

/* For smooth section visibility transitions */
.section-container {
    transition: all 0.4s ease-in-out;
    grid-template-rows: 1fr;
    opacity: 1;
}
.section-container-hidden {
    grid-template-rows: 0fr;
    opacity: 0;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    padding-top: 0;
    padding-bottom: 0;
}

/* Enhanced table styling for dark theme */
.prose table {
  width: 100% !important;
  table-layout: fixed !important;
  border-collapse: collapse !important;
  border: 2px solid #64748b !important; /* slate-500 */
  border-radius: 8px !important;
  overflow: hidden !important;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
  margin: 1.5rem 0 !important;
  background-color: #334155 !important; /* slate-700 */
}

.prose th {
  color: white !important;
  background-color: #475569 !important; /* slate-600 */
  font-weight: bold !important;
  padding: 16px 12px !important;
  text-align: center !important;
  border-bottom: 2px solid #64748b !important; /* slate-500 */
  font-size: 0.85rem !important;
  text-transform: uppercase !important;
  letter-spacing: 0.05em !important;
  vertical-align: middle !important;
  line-height: 1.3 !important;
  word-wrap: break-word !important;
}

.prose td {
  color: #e2e8f0 !important; /* slate-200 */
  padding: 16px 12px !important;
  border-bottom: 1px solid #475569 !important; /* slate-600 */
  vertical-align: top !important;
  line-height: 1.5 !important;
  word-wrap: break-word !important;
  overflow-wrap: break-word !important;
}

.prose tbody tr {
  transition: background-color 0.2s ease !important;
}

.prose tbody tr:hover {
  background-color: rgba(51, 65, 85, 0.5) !important; /* slate-700/50 */
}

.prose tbody tr:last-child td {
  border-bottom: none !important;
}

.prose thead tr {
  border-bottom: 2px solid #64748b !important;
}

/* Specific column sizing for better balance */
.prose table th:first-child,
.prose table td:first-child {
  width: 18% !important; /* Life Stage column */
}

.prose table th:nth-child(2),
.prose table td:nth-child(2) {
  width: 20% !important; /* Core Identity column */
}

.prose table th:nth-child(3),
.prose table td:nth-child(3) {
  width: 22% !important; /* Key Achievements column */
}

.prose table th:nth-child(4),
.prose table td:nth-child(4) {
  width: 22% !important; /* Primary Challenges column */
}

.prose table th:nth-child(5),
.prose table td:nth-child(5) {
  width: 18% !important; /* Oracle Insights column */
}

.prose p {
  line-height: 1.7 !important;
  margin-bottom: 1rem !important;
}

.prose strong {
  font-weight: 600 !important;
}

/* Better list styling */
.prose ol,
.prose ul {
  margin-left: 1.5rem !important;
  margin-bottom: 1rem !important;
}

.prose li {
  margin-bottom: 0.5rem !important;
  line-height: 1.6 !important;
}

.prose ol {
  list-style-type: decimal !important;
}

.prose ul {
  list-style-type: disc !important;
}

/* Better spacing for table container */
.prose table + * {
  margin-top: 2rem !important;
}

/* Better responsive behavior */
@media (max-width: 1024px) {
  .prose table {
    font-size: 0.85rem !important;
  }
  
  .prose th,
  .prose td {
    padding: 12px 8px !important;
  }
}

/* Ensure tables are scrollable on small screens */
.prose {
  overflow-x: auto !important;
}

/* Fix for dark mode OS on light theme components */
@media (prefers-color-scheme: dark) {
    .force-light-theme .prose {
        --tw-prose-body: #334155;
        --tw-prose-headings: #1e293b;
        --tw-prose-lead: #4b5563;
        --tw-prose-links: #4f46e5;
        --tw-prose-bold: #1e293b;
        --tw-prose-counters: #6b7280;
        --tw-prose-bullets: #d1d5db;
        --tw-prose-hr: #e5e7eb;
        --tw-prose-quotes: #1e293b;
        --tw-prose-quote-borders: #e5e7eb;
        --tw-prose-captions: #6b7280;
        --tw-prose-code: #1e293b;
        --tw-prose-pre-code: #e5e7eb;
        --tw-prose-pre-bg: #1e293b;
        --tw-prose-th-borders: #d1d5db;
        --tw-prose-td-borders: #e5e7eb;
    }
}
