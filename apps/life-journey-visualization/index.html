<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row =>
                    row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                );

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

        <table id="statsTable">
            <tr>
                <th>Metric</th>
                <th>2019-2020 (%)</th>
                <th>2020-2021 (%)</th>
                <th>2021-2022 (%)</th>
                <th>2022-2023 (%)</th>
                <th>2023-2024 (%)</th>
                <th>Avg. Growth (%)</th>
                <th>Variance</th>
                <th>Insight</th>
            </tr>
        </table>
    </div>

    <script>
        // Data for charts
        const years = [2019, 2020, 2021, 2022, 2023, 2024];
        const data = {
            financial: [10, 15, 20, 25, 80, 90],
            learning: [20, 30, 50, 70, 85, 95],
            career: [10, 20, 30, 50, 80, 90],
            personal: [15, 25, 40, 60, 75, 85],
            emotional: [10, 20, 30, 40, 60, 70]
        };

        // Calculate stats
        const stats = {
            financial: [], learning: [], career: [], personal: [], emotional: []
        };
        const avgGrowth = {};
        const variance = {};

        // Percentage changes
        for (let metric in data) {
            stats[metric] = [];
            for (let i = 1; i < data[metric].length; i++) {
                const change = ((data[metric][i] - data[metric][i-1]) / data[metric][i-1] * 100).toFixed(2);
                stats[metric].push(change);
            }
            avgGrowth[metric] = (stats[metric].reduce((a, b) => a + parseFloat(b), 0) / stats[metric].length).toFixed(2);
        }

        // Variance (standard deviation)
        for (let metric in data) {
            const mean = data[metric].reduce((a, b) => a + b, 0) / data[metric].length;
            const squaredDiffs = data[metric].map(val => Math.pow(val - mean, 2));
            variance[metric] = Math.sqrt(squaredDiffs.reduce((a, b) => a + b, 0) / squaredDiffs.length).toFixed(2);
        }

        // Insights for table
        const insights = {
            financial: "Surged in 2023 with ₦20M and house purchase; stabilized in 2024 with mother's house.",
            learning: "Consistent growth, peaking with 1,000+ books and philosophical dialogues in 2024.",
            career: "Rapid rise in 2023 with Division Manager role; diversified roles in 2024.",
            personal: "Steady progress with journaling and affirmations; 2024 saw divorce challenges.",
            emotional: "Grew through childhood pain; 2024 divorce tested but strengthened resilience."
        };

        // Populate stats table
        const table = document.getElementById('statsTable');
        for (let metric in stats) {
            const row = table.insertRow();
            row.insertCell().textContent = metric.charAt(0).toUpperCase() + metric.slice(1);
            stats[metric].forEach(change => {
                row.insertCell().textContent = change + '%';
            });
            row.insertCell().textContent = avgGrowth[metric] + '%';
            row.insertCell().textContent = variance[metric];
            row.insertCell().textContent = insights[metric];
        }

        // Chart.js options for mobile
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: window.innerWidth <= 768 ? 10 : 12
                        }
                    }
                },
                tooltip: {
                    bodyFont: {
                        size: window.innerWidth <= 768 ? 10 : 12
                    },
                    titleFont: {
                        size: window.innerWidth <= 768 ? 12 : 14
                    },
                    callbacks: {
                        afterLabel: function(context) {
                            const year = context.label;
                            if (year == 2023) return '₦20M earned, house purchased, married Nuriyyah';
                            if (year == 2024) return 'Divorced Nuriyyah, new roles, mother’s house';
                            return '';
                        }
                    }

            },
            scales: {
                x: {
                    ticks: {
                        font: {
                            size: window.innerWidth <= 768 ? 10 : 12
                        }
                    }
                },
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        font: {
                            size: window.innerWidth <= 768 ? 10 : 12
                        }
                    }
                }
            },
            animation: {
                duration: window.innerWidth <= 768 ? 1000 : 2000,
                easing: 'easeInOutQuad'
            }
        };

        // Line Chart
        new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels: years,
                datasets: [
                    { label: 'Financial Growth', data: data.financial, borderColor: '#FF6384', fill: false, tension: 0.4 },
                    { label: 'Learning Efficiency', data: data.learning, borderColor: '#36A2EB', fill: false, tension: 0.4 },
                    { label: 'Career Progress', data: data.career, borderColor: '#FFCE56', fill: false, tension: 0.4 },
                    { label: 'Personal Development', data: data.personal, borderColor: '#4BC0C0', fill: false, tension: 0.4 },
                    { label: 'Emotional Resilience', data: data.emotional, borderColor: '#9966FF', fill: false, tension: 0.4 }
                ]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'Growth Trends', font: { size: window.innerWidth <= 768 ? 14 : 16 } }
                }
            }
        });

        // Bar Chart

                    { label: 'Emotional Resilience', data: data.emotional, backgroundColor: 'rgba(153,102,255,0.7)' }
                ]
            },
            options: {

                plugins: {

                    title: { display: true, text: 'Yearly Comparison', font: { size: window.innerWidth <= 768 ? 14 : 16 } }
                }
            }
        });

        // Area Chart
        new Chart(document.getElementById('areaChart'), {
            type: 'line',
            data: {
                labels: years,
                datasets: [
                    { label: 'Financial Growth', data: data.financial, backgroundColor: 'rgba(255,99,132,0.2)', borderColor: '#FF6384', fill: true },
                    { label: 'Learning Efficiency', data: data.learning, backgroundColor: 'rgba(54,162,235,0.2)', borderColor: '#36A2EB', fill: true },
                    { label: 'Career Progress', data: data.career, backgroundColor: 'rgba(255,206,86,0.2)', borderColor: '#FFCE56', fill: true },
                    { label: 'Personal Development', data: data.personal, backgroundColor: 'rgba(75,192,192,0.2)', borderColor: '#4BC0C0', fill: true },
                    { label: 'Emotional Resilience', data: data.emotional, backgroundColor: 'rgba(153,102,255,0.2)', borderColor: '#9966FF', fill: true }
                ]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'Cumulative Growth', font: { size: window.innerWidth <= 768 ? 14 : 16 } }

        });

        // Radar Chart (2024 Balance)
        new Chart(document.getElementById('radarChart'), {

                }]
            },
            options: {
                ...chartOptions,

                },
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            stepSize: 20,
                            font: {
                                size: window.innerWidth <= 768 ? 10 : 12
                            }
                        }
                    }
                }
            }
        });

        // Dark Mode Toggle
        document.getElementById('toggle-mode').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            document.querySelectorAll('.chart-container, #stats').forEach(el => el.classList.toggle('dark-mode'));
        });
    </script>
